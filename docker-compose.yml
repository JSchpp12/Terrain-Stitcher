# Convenience wrapper around the Terrain-Stitcher image.
#
# The project directory is mounted at /data (the image's WORKDIR), so
# Shape.json, weathercams/ and every generated output live on the host, and the
# `refresh-services` registry cache persists in ./.cache between runs.
#
# Examples:
#   docker compose build
#   docker compose run --rm terrain-stitcher refresh-services
#   docker compose run --rm terrain-stitcher create-bounds -lat 39.0 -lon -105.0 -t POINT -vd 5
#   docker compose run --rm terrain-stitcher process-terrain --name perryville -s Shape.json -d 75 --lod 12
#
# USGS credentials are read from ./.env (mounted into the container). Copy
# .env.example or create .env with:
#   USGS_APPLICATION_KEY=your_api_key_here
#   USGS_USERNAME=
services:
  terrain-stitcher:
    build:
      context: .
    image: terrain-stitcher:latest
    working_dir: /data
    volumes:
      - .:/data
    # Uncomment to also inject .env values as real environment variables
    # (the app already reads /data/.env via python-dotenv):
    # env_file:
    #   - .env
