# Terrain-Stitcher without a VPN.
#
# Standalone stack: no Gluetun, no network_mode. Use this to download directly
# over your normal connection. It reads the repo-root .env too, but only the
# USGS credentials apply; the Surfshark/WireGuard settings are ignored.
#
# Run from the repository root. No volumes are baked in, so mount your data
# directory at /data on every run:
#   docker compose -f docker/docker-compose.novpn.yml run --rm \
#     -v "./data/perryville:/data" terrain-stitcher refresh-services
#
# For the Surfshark/Gluetun VPN variant, use docker-compose.yml.

name: terrain-stitcher-novpn

services:
  terrain-stitcher:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: terrain-stitcher:latest
    working_dir: /data
    # Nothing is mounted by default — bring your own data directory:
    #   docker compose ... run -v <host-dir>:/data terrain-stitcher <command>
    # (`run --rm` discards the container afterwards, so without a mount any
    # output it wrote under /data is lost.)
    env_file:
      # Repo-root .env: the app only uses the optional USGS credentials.
      - path: ../.env
        required: false